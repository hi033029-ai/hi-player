name: Apply app polish
on:
  push:
    branches: [feature/app-polish]
    paths: [polish.patch.xz.b64]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/app-polish
      - name: Apply tested app changes
        run: |
          base64 -d polish.patch.xz.b64 | xz -d > /tmp/polish.patch
          git apply --check /tmp/polish.patch
          git apply --index /tmp/polish.patch
          git rm polish.patch.xz.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply tested app polish and browser improvements'
          git push origin HEAD:feature/app-polish
