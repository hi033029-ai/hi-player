name: Gecko migration validation

on:
  push:
    branches: [ 'feat/geckoview-browser-migration' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gecko-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Validate workflow definitions and source generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate GitHub Actions contexts and YAML
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=
      - name: Test context-checked compatibility generation
        run: |
          python3 tools/test_prepare_gecko_build.py
          python3 tools/prepare_gecko_build.py
          git diff --exit-code

  regression:
    name: Legacy browser and player regressions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Deterministic JavaScript regression fixtures
        run: node tools/test_youtube_skipper.cjs
      - name: Compile and test legacy rollback without packaging an APK
        run: >-
          gradle --no-daemon :app:testDebugUnitTest --max-workers=2
          -PHI_PLAYER_GECKO_ENABLED=false
          --tests 'com.example.auth.*'
          --tests 'com.example.downloads.*'
          --tests 'com.example.player.*'
          --tests 'com.example.playback.*'
          --tests 'com.example.ui.screens.Browser*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-regression-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

  gecko-configuration:
    name: Configure Gecko-enabled app and source roots
    needs: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - run: gradle --no-daemon :app:tasks --all -PHI_PLAYER_GECKO_ENABLED=true --max-workers=2

  decoders:
    needs: gecko-configuration
    uses: ./.github/workflows/gecko-decoders.yml

  gecko:
    name: Compile integrated Gecko browser and run migration regressions
    needs: decoders
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - uses: actions/download-artifact@v4
        with:
          name: gecko-matching-media3-decoders
          path: build/gecko-decoders
      - name: Compile browser, native registration, auth, downloads and player tests
        run: >-
          gradle --no-daemon :app:testDebugUnitTest --max-workers=2
          -PHI_PLAYER_GECKO_ENABLED=true
          --tests 'com.example.browser.gecko.*'
          --tests 'com.example.ui.screens.GeckoEnginePolicyTest'
          --tests 'com.example.ui.screens.BrowserAddressInputTest'
          --tests 'com.example.auth.*'
          --tests 'com.example.downloads.*'
          --tests 'com.example.player.*'
          --tests 'com.example.playback.*'
          --tests 'com.example.ui.screens.Browser*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gecko-integrated-regression-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
