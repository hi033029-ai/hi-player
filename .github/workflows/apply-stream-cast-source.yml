name: Apply Stream Cast source only
on:
  push:
    branches: [feature/stream-cast-music-polish]
    paths: [stream-cast-source.patch.xz.b64]
permissions:
  contents: write
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch without building an APK
        run: |
          base64 -d stream-cast-source.patch.xz.b64 | xz -d > /tmp/stream-cast-source.patch
          git apply --index /tmp/stream-cast-source.patch
          git rm stream-cast-source.patch.xz.b64
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Polish music and Stream Cast window, retire Discover and fix browser nav timer (source only)'
          git push
