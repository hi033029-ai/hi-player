name: Apply video download fix
on:
  push:
    branches: [fix/browser-video-downloads]
    paths: [video-format.patch.xz.b64]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/browser-video-downloads
      - name: Apply video format and library correction
        run: |
          base64 -d video-format.patch.xz.b64 | xz -d > /tmp/video-format.patch
          git apply --check /tmp/video-format.patch
          git apply --index /tmp/video-format.patch
          git rm video-format.patch.xz.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix binary video filenames and register browser videos in library'
          git push origin HEAD:fix/browser-video-downloads
