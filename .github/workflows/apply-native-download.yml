name: Apply native downloader
on:
  push:
    branches: [feature/browser-download-engine]
    paths: [native-download.patch.xz.b64]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/browser-download-engine
      - name: Apply verified native download engine
        run: |
          base64 -d native-download.patch.xz.b64 | xz -d > /tmp/native-download.patch
          git apply --check /tmp/native-download.patch
          git apply --index /tmp/native-download.patch
          git rm native-download.patch.xz.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace Android downloader with Hi Browser native engine'
          git push origin HEAD:feature/browser-download-engine
