name: Apply UI performance source only
on:
  push:
    branches: [feature/stream-cast-music-polish]
    paths: [ui-performance-source.patch.xz.b64]
permissions:
  contents: write
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed source only (no compilation or APK)
        run: |
          base64 -d ui-performance-source.patch.xz.b64 | xz -d > /tmp/ui-performance-source.patch
          git apply --index /tmp/ui-performance-source.patch
          git rm ui-performance-source.patch.xz.b64
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bound artwork memory, isolate playback updates and move library work off UI thread (source only)'
          git push
