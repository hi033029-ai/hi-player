name: Apply system theme and playback source only
on:
  push:
    branches: [feature/stream-cast-music-polish]
    paths: [system-folder-hdr-source.patch.xz.b64]
permissions:
  contents: write
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source changes only (no build or APK)
        run: |
          base64 -d system-folder-hdr-source.patch.xz.b64 | xz -d > /tmp/source.patch
          git apply --index /tmp/source.patch
          git rm system-folder-hdr-source.patch.xz.b64
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add system theme, readable theme controls, folder-scoped playback and bounded HDR touch control (source only)'
          git push
