name: Apply account Drive UI source only
on:
  push:
    branches: [feature/account-drive-ui-polish]
    paths: [account-drive-ui.patch.xz.b64]
permissions:
  contents: write
jobs:
  apply-source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/account-drive-ui-polish
      - name: Apply source only - no compilation or APK build
        run: |
          base64 -d account-drive-ui.patch.xz.b64 | xz -d > /tmp/account-drive-ui.patch
          git apply --check /tmp/account-drive-ui.patch
          git apply --index /tmp/account-drive-ui.patch
          git rm account-drive-ui.patch.xz.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Soften UI and integrate Google account Drive (source only)'
          git push
