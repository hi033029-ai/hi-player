name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: main-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  decoders:
    uses: ./.github/workflows/gecko-decoders.yml
  build:
    needs: decoders
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          cache-read-only: false
      - uses: actions/download-artifact@v4
        with:
          name: gecko-matching-media3-decoders
          path: build/gecko-decoders
      - name: Deterministic browser script regression checks
        run: node tools/test_youtube_skipper.cjs
      - name: Browser, account, download and player regressions
        run: >-
          gradle --no-daemon :app:testDebugUnitTest --max-workers=2
          -PHI_PLAYER_GECKO_ENABLED=true -PHI_PLAYER_DRIVE_ENABLED=true
          --tests 'com.example.browser.gecko.*'
          --tests 'com.example.auth.*'
          --tests 'com.example.downloads.*'
          --tests 'com.example.player.*'
          --tests 'com.example.playback.*'
          --tests 'com.example.ui.screens.Browser*'
      - name: Build optimized APK using the existing signing key
        run: gradle --no-daemon :app:assembleDebug -PHI_PLAYER_GECKO_ENABLED=true -PHI_PLAYER_DRIVE_ENABLED=true -PHI_PLAYER_ARM64_ONLY=true --max-workers=2
      - name: Check native compatibility, bundled notices and APK size
        run: HI_PLAYER_EXPECTED_APK_ABI=arm64-v8a python3 tools/check_gecko_apk.py
      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            build/gecko-apk-review.json
          if-no-files-found: ignore
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: hi-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
