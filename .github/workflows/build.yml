name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # GitHub's Ubuntu runner already includes the Android SDK. The older
      # setup-android v3 action now requests the removed legacy `tools`
      # package and fails before Gradle has a chance to build the app.
      - name: Configure preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # debug.keystore is checked into this repository so every APK
      # remains signed with the same key and can update the previous APK.

      - name: YouTube skipper deterministic regression fixtures
        run: node tools/test_youtube_skipper.cjs

      - name: Signed blocker and progress security regression tests
        timeout-minutes: 10
        run: >-
          gradle testDebugUnitTest -PHI_PLAYER_DRIVE_ENABLED=true
          --tests 'com.example.ui.screens.BlockerPackageProtocolTest'
          --tests 'com.example.ui.screens.BrowserFilterFileUpdaterTest'
          --tests 'com.example.ui.components.BrowserProgressStateTest'

      - name: Build APK with user-approved Drive testing
        run: gradle assembleDebug -PHI_PLAYER_DRIVE_ENABLED=true

      - name: Targeted lyrics, downloaded audio and theme regression tests
        id: regression_tests
        continue-on-error: true
        timeout-minutes: 10
        run: >-
          gradle testDebugUnitTest -PHI_PLAYER_DRIVE_ENABLED=true
          --tests 'com.example.lyrics.LyricsTextTest'
          --tests 'com.example.lyrics.LyricsQueryTest'
          --tests 'com.example.ui.components.AudioLyricsPanelTest'
          --tests 'com.example.downloads.CompletedAudioLibraryTest'
          --tests 'com.example.data.SystemThemeDefaultMigrationTest'
          --tests 'com.example.ui.screens.BrowserVideoPolicyTest'
          --tests 'com.example.ui.screens.OrbitBrowserFeaturesTest'
          --tests 'com.example.ui.screens.BrowserAppearancePolicyTest'
          --tests 'com.example.ui.feedback.UserFacingErrorsTest'
          --tests 'com.example.ui.navigation.TabHistoryTest'
          --tests 'com.example.auth.SecureWebsitePolicyTest'
          --tests 'com.example.data.RecycleBinVisibilityTest'
          --tests 'com.example.ui.screens.BrowserLoadingPolicyTest'

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: regression-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: hi-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}
          name: Hi Player APK ${{ github.run_id }}
          generate_release_notes: false
          body: "Hi Player 1.0.76 (77), built from commit ${{ github.sha }}. Drive access is for testing: Google has not verified the restricted permission and may show a warning or block authorization."
          files: app/build/outputs/apk/debug/*.apk
