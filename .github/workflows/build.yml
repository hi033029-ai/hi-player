name: Build APK
on:
  workflow_dispatch:
    inputs:
      release_variants:
        description: Build the test-signed arm64 release APK and app bundle
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: main-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  decoders:
    uses: ./.github/workflows/gecko-decoders.yml
  playback-test:
    needs: decoders
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          cache-read-only: false
      - uses: actions/download-artifact@v4
        with:
          name: gecko-matching-media3-decoders
          path: build/gecko-decoders
      - name: Generate growing-video fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p app/src/debug/assets
          ffmpeg -f lavfi -i 'testsrc2=size=320x180:rate=12' -f lavfi -i 'sine=frequency=440:sample_rate=48000' -t 16 -c:v libx264 -profile:v baseline -g 12 -pix_fmt yuv420p -c:a aac -b:a 64k -y app/src/debug/assets/gecko_growing_test.mkv
      - name: Enable hardware virtualization
        run: if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
      - name: Verify growing-file video playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none
          script: |
            set +e
            gradle --no-daemon :app:connectedDebugAndroidTest -PHI_PLAYER_GECKO_ENABLED=true -PHI_PLAYER_GECKO_DEVICE_TEST=true -PHI_PLAYER_GECKOVIEW_ABI=x86_64 -PHI_PLAYER_ABI_FILTERS=x86_64 --max-workers=2 -Pandroid.testInstrumentationRunnerArguments.class=com.example.browser.gecko.GrowingPlaybackDeviceTest
            result=$?
            mkdir -p build/player-screen-diagnostics
            adb pull /sdcard/Android/data/com.aistudio.hiplayer.vdmk/files/growing-screen-diagnostic.png build/player-screen-diagnostics/ || true
            adb logcat -d -s GrowingScreenTest:I '*:S' > build/player-screen-diagnostics/player-log.txt || true
            exit "$result"
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growing-playback-device-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/player-screen-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
  build:
    needs: [decoders, playback-test]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          cache-read-only: false
      - uses: actions/download-artifact@v4
        with:
          name: gecko-matching-media3-decoders
          path: build/gecko-decoders
      - name: Deterministic browser script regression checks
        run: |
          node tools/test_youtube_skipper.cjs
          node tools/test_gecko_request_context.cjs
          node tools/test_page_skipper.cjs
          node tools/test_adblock_safety.cjs
      - name: Browser, account, download and player regressions
        run: >-
          gradle --no-daemon :app:testDebugUnitTest --max-workers=2
          -PHI_PLAYER_GECKO_ENABLED=true -PHI_PLAYER_DRIVE_ENABLED=true
          -PHI_PLAYER_GECKOVIEW_ABI=arm64-v8a -PHI_PLAYER_ABI_FILTERS=arm64-v8a
          --tests 'com.example.browser.gecko.*'
          --tests 'com.example.auth.*'
          --tests 'com.example.downloads.*'
          --tests 'com.example.player.*'
          --tests 'com.example.playback.*'
          --tests 'com.example.ui.screens.Browser*'
      - name: Build optimized arm64 debug APK
        run: gradle --no-daemon :app:assembleDebug -PHI_PLAYER_GECKO_ENABLED=true -PHI_PLAYER_DRIVE_ENABLED=true -PHI_PLAYER_GECKOVIEW_ABI=arm64-v8a -PHI_PLAYER_ABI_FILTERS=arm64-v8a --max-workers=2
      - name: Check debug APK native compatibility, notices and size
        run: HI_PLAYER_EXPECTED_APK_ABI=arm64-v8a python3 tools/check_gecko_apk.py
      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            build/gecko-apk-review.json
          if-no-files-found: ignore
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hi-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Initialize release artifact directory
        if: github.event_name == 'workflow_dispatch' && inputs.release_variants
        run: mkdir -p dist
      - name: Build arm64-v8a release APK split (test-signed)
        if: github.event_name == 'workflow_dispatch' && inputs.release_variants
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEY_ALIAS: androiddebugkey
        run: |
          rm -rf app/build/outputs/apk/release
          gradle --no-daemon --no-configuration-cache :app:assembleRelease --max-workers=2 \
            -PHI_PLAYER_GECKO_ENABLED=true -PHI_PLAYER_DRIVE_ENABLED=true \
            -PHI_PLAYER_GECKOVIEW_ABI=arm64-v8a -PHI_PLAYER_ABI_FILTERS=arm64-v8a
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" dist/hi-player-arm64-v8a-release.apk
      - name: Build arm64-v8a-only release App Bundle (test-signed)
        if: github.event_name == 'workflow_dispatch' && inputs.release_variants
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEY_ALIAS: androiddebugkey
        run: |
          rm -rf app/build/outputs/bundle/release
          gradle --no-daemon --no-configuration-cache :app:bundleRelease --max-workers=2 \
            -PHI_PLAYER_GECKO_ENABLED=true -PHI_PLAYER_DRIVE_ENABLED=true \
            -PHI_PLAYER_GECKOVIEW_ABI=arm64-v8a -PHI_PLAYER_ABI_FILTERS=arm64-v8a
          bundle="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -n "$bundle"
          cp "$bundle" dist/hi-player-arm64-v8a-release.aab
      - name: Check arm64-only release APK and AAB contents
        if: github.event_name == 'workflow_dispatch' && inputs.release_variants
        run: python3 tools/check_gecko_release_outputs.py
      - name: Upload test-signed arm64 APK, bundle and size report
        if: github.event_name == 'workflow_dispatch' && inputs.release_variants
        uses: actions/upload-artifact@v4
        with:
          name: hi-player-gecko-release-test-signed
          path: |
            dist/*.apk
            dist/*.aab
            build/gecko-release-review.json
          if-no-files-found: error
          retention-days: 14
