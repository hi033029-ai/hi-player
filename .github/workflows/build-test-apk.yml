name: Build Hi Player test APK 1.0.69
on:
  push:
    branches: [feature/stream-cast-music-polish]
    paths: [.github/workflows/build-test-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Build approved APK with Drive testing enabled
        run: gradle assembleDebug -PHI_PLAYER_DRIVE_ENABLED=true
      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hi-player-v1.0.69-code70-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish user-requested test APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          name: Hi Player v1.0.69 (70) test APK
          prerelease: true
          generate_release_notes: false
          body: "User-requested test APK, version 1.0.69 (70), from feature commit ${{ github.sha }}. Main has not been merged. Includes current UI, selection, folder playback, themes, browser navigation and Cast changes. Drive access is for testing: Google has not verified the restricted permission and may show a warning or block authorization. Physical-device playback/Cast/OAuth validation is still needed."
          files: app/build/outputs/apk/debug/app-debug.apk
