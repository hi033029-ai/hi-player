name: Apply safe video music patch
on:
  push:
    branches: [fix/safe-video-music-download-row]
    paths: [safe-video-music.patch.xz.b64]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/safe-video-music-download-row
      - name: Apply tested source update
        run: |
          base64 -d safe-video-music.patch.xz.b64 | xz -d > /tmp/safe-video-music.patch
          git apply --check /tmp/safe-video-music.patch
          git apply --index /tmp/safe-video-music.patch
          git rm safe-video-music.patch.xz.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix ad handoff, music discovery and compact downloads v1.0.65'
          git push
