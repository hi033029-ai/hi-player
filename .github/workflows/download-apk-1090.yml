name: Build downloadable Hi Player 1.0.90 APK

on:
  push:
    branches: [ 'apk/1.0.90-download' ]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Build signed debug APK
        run: gradle --no-daemon assembleDebug -PHI_PLAYER_DRIVE_ENABLED=true --max-workers=2
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Hi-Player-1.0.90.apk
      - name: Publish downloadable test APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.90-apk
          target_commitish: 91c78ac7562e51acd2c78fe49dc44e2881df5bd4
          name: Hi Player 1.0.90 test APK
          prerelease: true
          body: 'Debug-signed test build from the 1.0.90 feature branch. The changes are not merged into main and have not been verified on a physical device.'
          files: Hi-Player-1.0.90.apk
