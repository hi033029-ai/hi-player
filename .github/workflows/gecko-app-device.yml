name: Gecko app device validation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gecko-app-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  decoders:
    uses: ./.github/workflows/gecko-decoders.yml
  device:
    needs: decoders
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [24, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          cache-read-only: false
      - uses: actions/download-artifact@v4
        with:
          name: gecko-matching-media3-decoders
          path: build/gecko-decoders
      - name: Generate deterministic test media
        timeout-minutes: 10
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 240s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            timeout 300s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg
          fi
          bash tools/generate_playback_fixtures.sh
      - name: Compile unpublished device-test APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -PHI_PLAYER_GECKO_ENABLED=true -PHI_PLAYER_GECKO_DEVICE_TEST=true -PHI_PLAYER_GECKOVIEW_ABI=x86_64 -PHI_PLAYER_ABI_FILTERS=x86_64 --max-workers=2
      - name: Review APK size and native packaging
        run: HI_PLAYER_EXPECTED_APK_ABI=x86_64 python3 tools/check_gecko_apk.py
      - name: Enable hardware virtualization
        run: if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
      - name: Verify real app engine and Android 7 fallback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -memory 2048 -partition-size 4096 -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none
          script: |
            if [ '${{ matrix.api }}' = '24' ]; then CLASS=com.example.browser.gecko.GeckoFallbackDeviceTest; else CLASS=com.example.browser.gecko.GeckoMigrationDeviceTest,com.example.browser.gecko.GeckoChromeDeviceTest; fi; CLASS="$CLASS,com.example.player.PlaybackDeviceSmokeTest,com.example.player.PlaybackGestureDeviceTest,com.example.player.ColorPresetGpuTest"; gradle --no-daemon -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" :app:connectedDebugAndroidTest -PHI_PLAYER_GECKO_ENABLED=true -PHI_PLAYER_GECKO_DEVICE_TEST=true -PHI_PLAYER_GECKOVIEW_ABI=x86_64 -PHI_PLAYER_ABI_FILTERS=x86_64 --max-workers=1 -Pandroid.testInstrumentationRunnerArguments.class="$CLASS"
      - name: Upload reports only, never APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gecko-app-device-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/gecko-apk-review.json
            build/playback-diagnostics/
          if-no-files-found: ignore
          retention-days: 3
