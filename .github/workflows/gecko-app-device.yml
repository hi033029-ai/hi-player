name: Gecko app device validation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gecko-app-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  decoders:
    uses: ./.github/workflows/gecko-decoders.yml
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: fixtures
        with:
          path: app/src/debug/assets
          key: playback-fixtures-v1-${{ runner.os }}-${{ hashFiles('tools/generate_playback_fixtures.sh') }}
      - name: Generate and verify deterministic test media
        if: steps.fixtures.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # Use the primary archive when the runner's regional mirror stalls.
            sudo sed -i 's|^URIs:.*|URIs: https://archive.ubuntu.com/ubuntu|' /etc/apt/sources.list.d/ubuntu.sources
            timeout 240s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            timeout 600s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 --no-install-recommends install -y ffmpeg
          fi
          bash tools/generate_playback_fixtures.sh
      - uses: actions/upload-artifact@v4
        with:
          name: playback-device-fixtures
          path: |
            app/src/debug/assets/gecko_test.mp4
            app/src/debug/assets/gecko_test.mkv
            app/src/debug/assets/growing_test.mkv
            app/src/debug/assets/playback_test.webm
            app/src/debug/assets/grading_reference.mp4
            app/src/debug/assets/compact_hdr10.mkv
          if-no-files-found: error
          retention-days: 3
  device:
    needs: [decoders, fixtures]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [24, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          cache-read-only: false
      - uses: actions/download-artifact@v4
        with:
          name: gecko-matching-media3-decoders
          path: build/gecko-decoders
      - uses: actions/download-artifact@v4
        with:
          name: playback-device-fixtures
          path: app/src/debug/assets
      - name: Compile unpublished device-test APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -PHI_PLAYER_GECKO_ENABLED=true -PHI_PLAYER_GECKO_DEVICE_TEST=true -PHI_PLAYER_GECKOVIEW_ABI=x86_64 -PHI_PLAYER_ABI_FILTERS=x86_64 --max-workers=2
      - name: Review APK size and native packaging
        run: HI_PLAYER_EXPECTED_APK_ABI=x86_64 python3 tools/check_gecko_apk.py
      - name: Enable hardware virtualization
        run: if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
      - name: Verify real app engine and Android 7 fallback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -memory 2048 -partition-size 4096 -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none
          script: |
            if [ '${{ matrix.api }}' = '24' ]; then CLASS=com.example.browser.gecko.GeckoFallbackDeviceTest; else CLASS=com.example.browser.gecko.GeckoMigrationDeviceTest,com.example.browser.gecko.GeckoChromeDeviceTest; fi; CLASS="$CLASS,com.example.player.PlaybackDeviceSmokeTest,com.example.player.PlaybackGestureDeviceTest,com.example.player.ColorPresetGpuTest,com.example.filemanager.RecycleBinDeviceTest"; gradle --no-daemon -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" :app:connectedDebugAndroidTest -PHI_PLAYER_GECKO_ENABLED=true -PHI_PLAYER_GECKO_DEVICE_TEST=true -PHI_PLAYER_GECKOVIEW_ABI=x86_64 -PHI_PLAYER_ABI_FILTERS=x86_64 --max-workers=1 -Pandroid.testInstrumentationRunnerArguments.class="$CLASS"
      - name: Upload reports only, never APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gecko-app-device-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/gecko-apk-review.json
            build/playback-diagnostics/
          if-no-files-found: ignore
          retention-days: 3
