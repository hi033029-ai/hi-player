name: Apply compact file manager source only
on:
  push:
    branches: [feature/stream-cast-music-polish]
    paths: [clean-file-manager-source.patch.xz.b64]
permissions:
  contents: write
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source changes only (no build or APK)
        run: |
          base64 -d clean-file-manager-source.patch.xz.b64 | xz -d > /tmp/source.patch
          git apply --index /tmp/source.patch
          git rm clean-file-manager-source.patch.xz.b64
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Simplify file browsing, hide inactive selection circles and default upgrades to System theme (source only)'
          git push
