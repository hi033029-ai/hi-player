name: Apply browser source update
on:
  push:
    branches: [feature/account-drive-ui-polish]
    paths: [browser-source.patch.xz.b64]
permissions:
  contents: write
jobs:
  apply-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source only (no APK build)
        run: |
          base64 -d browser-source.patch.xz.b64 | xz -d > /tmp/browser-source.patch
          git apply --index /tmp/browser-source.patch
          git rm browser-source.patch.xz.b64
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add browser quick navigation and local history suggestions (source only)'
          git push
