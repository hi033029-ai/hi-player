name: Gecko release artifacts (test-signed)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gecko-release-artifacts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  decoders:
    uses: ./.github/workflows/gecko-decoders.yml
  release:
    name: Build and verify test-signed release outputs
    needs: decoders
    runs-on: ubuntu-latest
    timeout-minutes: 70
    # These credentials intentionally use the committed public test key. Artifacts from
    # this workflow are installable test builds and are not valid for Google Play.
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
      STORE_PASSWORD: android
      KEY_PASSWORD: android
      KEY_ALIAS: androiddebugkey
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          cache-read-only: false
      - uses: actions/download-artifact@v4
        with:
          name: gecko-matching-media3-decoders
          path: build/gecko-decoders
      - name: Deterministic browser script regression checks
        run: node tools/test_youtube_skipper.cjs
      - name: Browser, account, download and player unit tests
        run: >-
          gradle --no-daemon :app:testDebugUnitTest --max-workers=2
          -PHI_PLAYER_GECKO_ENABLED=true -PHI_PLAYER_DRIVE_ENABLED=true
          -PHI_PLAYER_GECKOVIEW_ABI=arm64-v8a -PHI_PLAYER_ABI_FILTERS=arm64-v8a
          --tests 'com.example.browser.gecko.*'
          --tests 'com.example.auth.*'
          --tests 'com.example.downloads.*'
          --tests 'com.example.player.*'
          --tests 'com.example.playback.*'
          --tests 'com.example.ui.screens.Browser*'
      - name: Initialize artifact directory
        run: mkdir -p dist
      - name: Build arm64-v8a release APK split
        run: |
          rm -rf app/build/outputs/apk/release
          gradle --no-daemon --no-configuration-cache :app:assembleRelease --max-workers=2 \
            -PHI_PLAYER_GECKO_ENABLED=true -PHI_PLAYER_DRIVE_ENABLED=true \
            -PHI_PLAYER_GECKOVIEW_ABI=arm64-v8a -PHI_PLAYER_ABI_FILTERS=arm64-v8a
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" dist/hi-player-arm64-v8a-release.apk
      - name: Build armeabi-v7a release APK split
        run: |
          rm -rf app/build/outputs/apk/release
          gradle --no-daemon --no-configuration-cache :app:assembleRelease --max-workers=2 \
            -PHI_PLAYER_GECKO_ENABLED=true -PHI_PLAYER_DRIVE_ENABLED=true \
            -PHI_PLAYER_GECKOVIEW_ABI=armeabi-v7a -PHI_PLAYER_ABI_FILTERS=armeabi-v7a
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" dist/hi-player-armeabi-v7a-release.apk
      - name: Build two-ABI release App Bundle
        run: |
          rm -rf app/build/outputs/bundle/release
          gradle --no-daemon --no-configuration-cache :app:bundleRelease --max-workers=2 \
            -PHI_PLAYER_GECKO_ENABLED=true -PHI_PLAYER_DRIVE_ENABLED=true \
            -PHI_PLAYER_GECKOVIEW_ABI=universal -PHI_PLAYER_ABI_FILTERS=arm64-v8a,armeabi-v7a
          bundle="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -n "$bundle"
          cp "$bundle" dist/hi-player-release.aab
      - name: Check split APKs, AAB ABIs, Gecko assets and native alignment
        run: python3 tools/check_gecko_release_outputs.py
      - name: Upload release-type test artifacts and size report
        uses: actions/upload-artifact@v4
        with:
          name: hi-player-gecko-release-test-signed
          path: |
            dist/*.apk
            dist/*.aab
            build/gecko-release-review.json
          if-no-files-found: error
          retention-days: 14
